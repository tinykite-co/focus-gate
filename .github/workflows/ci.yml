name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"
      - name: Syntax-check every extension script
        run: |
          for f in *.js; do
            echo "Checking $f"
            node -e "new Function(require('fs').readFileSync('$f','utf8'))"
          done
      - name: No inline <script> tags (Manifest V3 CSP)
        run: |
          if grep -rl "<script>" *.html; then
            echo "Inline <script> tags are not allowed under Manifest V3's default CSP." >&2
            exit 1
          fi
          echo "No inline scripts found."
