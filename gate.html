<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Focus Gate</title>
<style>
  :root {
    color-scheme: light dark;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #14151a;
    color: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 480px;
    width: 90%;
    text-align: left;
    padding: 36px;
  }
  .top-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .site {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .progress {
    font-size: 12px;
    opacity: 0.45;
    margin-bottom: 10px;
  }
  .progress-track {
    width: 100%;
    height: 4px;
    background: #24252c;
    border-radius: 999px;
    overflow: hidden;
    margin: 0 0 26px;
  }
  .progress-fill {
    height: 100%;
    background: #4d545e;
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .fact {
    font-size: 14px;
    line-height: 1.5;
    color: #b7bac2;
    background: #1c1d24;
    border-left: 3px solid #4d545e;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.45;
    margin: 0 0 22px;
    max-width: 44ch;
  }
  .url {
    font-size: 13px;
    opacity: 0.5;
    word-break: break-all;
    margin-bottom: 8px;
  }
  .closer {
    font-size: 15px;
    font-weight: 600;
    opacity: 0.9;
    margin: 0 0 20px;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  #no {
    font-size: 16px;
    font-weight: 700;
    padding: 14px 22px;
    width: 100%;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #3d8b5f;
    color: white;
    text-align: center;
  }
  #no:hover { background: #45a06b; }
  #no:focus-visible { outline: 3px solid #7fd6a4; outline-offset: 2px; }
  .yes-wrap {
    display: flex;
    justify-content: flex-start;
    width: 100%;
  }
  #yes {
    font-size: 12px;
    color: #6b6f78;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 6px 0;
  }
  #yes:hover { color: #8a8f99; }
  .hint {
    margin-top: 24px;
    font-size: 12px;
    opacity: 0.4;
    line-height: 1.5;
  }
  .kind-badge {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .kind-badge.work { background: #24352c; color: #7fd6a4; }
  .kind-badge.override { background: #3a2a2a; color: #e08a8a; }
</style>
</head>
<body>
  <div class="card">
    <div class="top-row">
      <div class="site" id="site">Site</div>
      <div class="kind-badge" id="kindBadge"></div>
    </div>
    <div class="progress" id="progressLabel"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="fact" id="fact" hidden></div>
    <h1 id="question">Is this for work?</h1>
    <div class="url" id="url"></div>
    <div class="closer" id="closer"></div>
    <div class="buttons" id="buttons">
      <button id="no">No, close this</button>
      <div class="yes-wrap"><button id="yes">yes</button></div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <script src="settings.js"></script>
  <script src="gate.js"></script>
</body>
</html>
