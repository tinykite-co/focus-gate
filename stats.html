<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Focus Gate — Insights</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    background: #14151a;
    color: #f2f2f2;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { opacity: 0.55; font-size: 13px; margin-bottom: 28px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tabs button {
    background: #1c1d24;
    border: 1px solid #2c2d36;
    color: #f2f2f2;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .tabs button.active { background: #3d8b5f; border-color: #3d8b5f; }
  .headline {
    background: #1c1d24;
    border: 1px solid #2c2d36;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 22px;
  }
  .headline .big { font-size: 30px; font-weight: 700; }
  .headline .caption { font-size: 13px; opacity: 0.6; margin-top: 4px; }
  .decisions { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; }
  .decisions span.n { font-weight: 700; }
  section { margin-bottom: 26px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.6; margin: 0 0 12px; }
  .site-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .site-row .name { width: 110px; flex-shrink: 0; }
  .site-row .bar-track {
    flex: 1;
    background: #1c1d24;
    border-radius: 6px;
    height: 18px;
    overflow: hidden;
  }
  .site-row .bar-fill {
    background: linear-gradient(90deg, #3d8b5f, #59b47d);
    height: 100%;
    border-radius: 6px;
  }
  .site-row .minutes { width: 60px; text-align: right; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .day-row { display: flex; align-items: flex-end; gap: 8px; height: 90px; margin-bottom: 6px; }
  .day-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .day-col .col-bar { width: 60%; background: #3d8b5f; border-radius: 4px 4px 0 0; min-height: 2px; }
  .day-col .col-label { font-size: 11px; opacity: 0.5; margin-top: 6px; }
  .empty { opacity: 0.5; font-size: 13px; padding: 10px 0; }
  .insight {
    font-size: 13px;
    opacity: 0.75;
    line-height: 1.6;
    background: #1c1d24;
    border: 1px solid #2c2d36;
    border-radius: 10px;
    padding: 14px 16px;
  }
</style>
</head>
<body>
  <h1>Insights</h1>
  <div class="sub">Time is only logged while a gated page is open, unlocked, and you're actively at your computer.</div>

  <div class="tabs">
    <button id="tabToday" class="active">Today</button>
    <button id="tabWeek">Last 7 days</button>
    <button id="tabMonth">Last 30 days</button>
  </div>

  <div class="headline">
    <div class="big" id="totalTime">0m</div>
    <div class="caption" id="totalCaption">spent on gated sites</div>
    <div class="decisions">
      <div>Said <span class="n" id="yesCount">0</span> yes</div>
      <div>Said <span class="n" id="noCount">0</span> no</div>
    </div>
  </div>

  <section>
    <h2>By site</h2>
    <div id="siteList"></div>
  </section>

  <section id="trendSection">
    <h2>Daily trend</h2>
    <div class="day-row" id="dayRow"></div>
  </section>

  <section>
    <h2>Insight</h2>
    <div class="insight" id="insightText"></div>
  </section>

  <script src="settings.js"></script>
  <script src="stats.js"></script>
</body>
</html>
