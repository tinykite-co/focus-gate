<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Focus Gate</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    width: 260px;
    padding: 16px;
    background: #14151a;
    color: #f2f2f2;
  }
  h1 { font-size: 15px; margin: 0 0 10px; }
  ul { margin: 0 0 12px; padding-left: 18px; font-size: 13px; opacity: 0.85; }
  li { margin-bottom: 4px; }
  p { font-size: 12px; opacity: 0.55; line-height: 1.5; margin: 0 0 12px; }
  button {
    width: 100%;
    background: #2a2b32;
    color: #f2f2f2;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #35363f; }
</style>
</head>
<body>
  <h1>Focus Gate is active</h1>
  <ul id="siteList"></ul>
  <p id="desc"></p>
  <div style="display:flex; gap:8px;">
    <button id="openInsights" style="flex:1;">Insights</button>
    <button id="openSettings" style="flex:1;">Settings</button>
  </div>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
