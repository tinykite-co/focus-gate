<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blocked</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #14151a;
    color: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { max-width: 380px; width: 90%; text-align: center; padding: 32px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { font-size: 14px; opacity: 0.6; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #2a2b32;
    color: #f2f2f2;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #35363f; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Blocked</h1>
    <p id="body">You said this wasn't for work, so it's staying closed. Go back or open a new tab whenever you're ready.</p>
    <button id="settingsBtn">Open Focus Gate settings</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
